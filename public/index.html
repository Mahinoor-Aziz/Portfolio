}).catch(()=>{$('#name').textContent='Content could not load';$('#intro').textContent='Open this page through npm start (http://localhost:5000) or Live Server started in the project folder, not the public folder.'});

function count(el){if(still)return;const n=parseFloat(el.dataset.n),dec=(el.dataset.n.split('.')[1]||'').length,u=el.dataset.u||'';let s=null;const f=t=>{s??=t;const p=Math.min((t-s)/1400,1);el.textContent=(n*(1-Math.pow(1-p,3))).toFixed(dec)+u;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

async function send(text,retry=false){text=text.trim();if(busy||!text)return;busy=true;$('#sug').hidden=true;

catch{w.remove();fail('no_backend',text)}busy=false}

<script>

const rings=[2.6,3.3].map((r,i)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(r,.012,8,160),new THREE.MeshBasicMaterial({color:0xffb3bd,transparent:true,opacity:.4}));m.rotation.x=i?1.1:.4;G.add(m);return m});
const shards=Array.from({length:14},()=>{const m=new THREE.Mesh(new THREE.OctahedronGeometry(.12+Math.random()*.14),new THREE.MeshStandardMaterial({color:0xd72848,metalness:.5,roughness:.3,emissive:0x5a0a1c}));m.userData={s:Math.random()*.01+.003,a:Math.random()*6.28,r:3+Math.random()*2.5,y:(Math.random()-.5)*4};G.add(m);return m});
const N=1600,pos=new Float32Array(N*3);for(let i=0;i<N;i++){const r=6+Math.random()*14,th=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);pos[i*3]=r*Math.sin(ph)*Math.cos(th);pos[i*3+1]=r*Math.sin(ph)*Math.sin(th);pos[i*3+2]=r*Math.cos(ph)-4}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xff8fa0,size:.045,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));S.add(pts);
let mx=0,my=0,t=0,mobile=false,run=true;
addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
$('#pause').addEventListener('click',()=>run=!run);
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();mobile=w<820}
addEventListener('resize',size);size();
(function loop(){requestAnimationFrame(loop);if(!run||document.hidden)return;t+=.01;
const p=scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight);
const tx=mobile?0:Math.cos(p*Math.PI*4)*3.2,ty=Math.sin(p*Math.PI*3)*1.2+(mobile?1.8:0);
G.position.x+=(tx-G.position.x)*.05;G.position.y+=(ty-G.position.y)*.05;
G.rotation.y=t*.4+p*6;core.rotation.x=t*.3;wire.rotation.y=-t*.25;rings[0].rotation.z=t*.5;rings[1].rotation.z=-t*.35;
G.scale.setScalar((mobile?.65:1)*(1+Math.sin(t*2)*.025));wire.material.opacity=Math.max(.18,.5-p*1.2);
shards.forEach(m=>{const u=m.userData;u.a+=u.s;m.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(t+u.a)*.3,Math.sin(u.a)*u.r*.6);m.rotation.x+=.02;m.rotation.y+=.015});
pts.rotation.y=t*.03+p*1.2;
C.position.x+=(mx*.8-C.position.x)*.05;C.position.y+=(-my*.5-C.position.y)*.05;C.lookAt(0,0,0);
L1.position.set(mx*8,-my*6,4);R.render(S,C)})();
})();
</script>
</body>
<script src="enhance.js" defer></script>
